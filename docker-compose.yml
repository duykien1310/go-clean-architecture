version: '3.9'
services:
  api:
    container_name: auth_service
    image: auth_service
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - database
      - cache
    links:
      - database
      - cache
  cache:
    container_name: redis
    image: redis:6.2-alpine
    restart: always
    ports:
      - '6379:6379'
    volumes: 
      - cache:/data
  database:
    container_name: database
    image: postgres:14-alpine
    restart: always
    ports:
      - 5432:5432
    volumes: 
      - db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/create_tables.sql
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=root
volumes:
  db:
    driver: local
  cache:
    driver: local
